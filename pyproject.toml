[project]
name = "lisa-runner"
version = "0.1.0"
description = "Plain Argo workflows on offline HPC compute nodes, through interLink 0.6.3 and its reverse tunnel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.44.11",
    "kubernetes>=37.0.3",
    "paramiko>=5.1.0",
    "pyyaml>=6.0.4",
]

[project.scripts]
lisa = "lisa.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli/lisa"]

[tool.pytest.ini_options]
testpaths = ["cli/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["cli"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["lisa"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
