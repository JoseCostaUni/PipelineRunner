# What the shadow pods of the reverse tunnel log in to the login node with, in the virtual kubelet's
# namespace (one per virtual node). interLink copies both into every shadow namespace; 'lisa down'
# deletes them and every copy. lisa fills in SSH_KEY and the login node's pinned host keys.
#
# The private key of HPC_USER sits in this Secret while the tunnel is on: interLink's documentation
# advises a key for the tunnel only, restricted on the site (docs/open-problems.md).
apiVersion: v1
kind: Secret
metadata:
  name: lisa-hpc-ssh-key
  namespace: ${namespace}
  labels: {app.kubernetes.io/managed-by: lisa-runner}
stringData:
  id_ed25519: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lisa-hpc-known-hosts
  namespace: ${namespace}
  labels: {app.kubernetes.io/managed-by: lisa-runner}
data:
  known_hosts: ""
