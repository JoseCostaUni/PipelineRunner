# TC00: the simplest case. One container template with a native input artifact (t1/input.txt) and
# a native output artifact (t1/result.txt) in the default artifact repository, as a scientist would
# write it for any Kubernetes cluster: nothing about interLink, Slurm or the HPC side.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: native-00-artifacts-
  labels:
    test: native-00
spec:
  entrypoint: upper
  templates:
  - name: upper
    inputs:
      artifacts:
      - name: data
        path: /tmp/t1/in/input.txt
        s3:
          key: t1/input.txt
    outputs:
      artifacts:
      - name: result
        path: /tmp/t1/out/result.txt
        archive:
          none: {}
        s3:
          key: t1/result.txt
    container:
      image: alpine:3.20
      command: [sh, -c]
      args:
      - |
        echo "[t1] main on $(hostname)"
        mkdir -p /tmp/t1/out
        tr a-z A-Z </tmp/t1/in/input.txt >/tmp/t1/out/result.txt
        cat /tmp/t1/out/result.txt
      resources:
        limits:
          cpu: "1"
          memory: 512Mi
