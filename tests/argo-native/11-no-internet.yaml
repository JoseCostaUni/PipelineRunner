# TC11 (new): where the step runs and what it can reach. The step records the node it runs on and
# tries to open TCP connections to the internet from inside its container, to IP addresses (so a
# missing DNS cannot hide an open network) and to names. It writes what happened to an output
# artifact, so every run leaves the evidence in the Global Storage. The test passes only if no
# connection opens (checks.py). The container itself always succeeds, so the record is kept either way.
# A TCP connect is the test, not an HTTP download: a download can fail on a redirect to a name the
# node cannot resolve although the network is open (seen on the testbed).
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: native-11-no-internet-
  labels: {test: native-11}
spec:
  entrypoint: probe
  templates:
  - name: probe
    outputs:
      artifacts:
      - name: report
        path: /tmp/out/network.txt
        archive: {none: {}}
        s3: {key: users/admin/test-11/network.txt}
    container:
      image: alpine:3.20
      command: [sh, -c]
      args:
      - |
        mkdir -p /tmp/out; r=/tmp/out/network.txt
        echo "node: $(hostname)" | tee "$r"
        if nslookup quay.io >/dev/null 2>&1; then echo "dns: resolves quay.io" | tee -a "$r"
        else echo "dns: cannot resolve quay.io" | tee -a "$r"; fi
        open=0
        for t in 1.1.1.1:443 8.8.8.8:53 9.9.9.9:443 quay.io:443 github.com:443; do
          if nc -z -w 5 "${t%:*}" "${t#*:}" 2>/dev/null; then echo "reachable: $t" | tee -a "$r"; open=1
          else echo "not reachable: $t" | tee -a "$r"; fi
        done
        if [ "$open" = 0 ]; then echo "internet: blocked" | tee -a "$r"; else echo "internet: OPEN" | tee -a "$r"; fi
      resources: {limits: {cpu: "1", memory: 256Mi}}
