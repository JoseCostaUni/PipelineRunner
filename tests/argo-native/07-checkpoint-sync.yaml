# TC07: intermediate results between steps. Each step's output is an artifact, kept in the Global
# Storage (the checkpoint) and passed to the next step; the last step aggregates the folder.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: native-07-checkpoint-sync-
  labels: {test: native-07}
spec:
  entrypoint: pipeline
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: compute-write
        templateRef: {name: lisa-modules, template: write}
        arguments:
          parameters:
          - {name: text, value: test-07-file}
          - {name: key, value: users/admin/test-07/file-1.txt}
      - name: compute-transform
        dependencies: [compute-write]
        templateRef: {name: lisa-modules, template: transform}
        arguments:
          parameters:
          - {name: key, value: users/admin/test-07/file-2.txt}
          artifacts:
          - {name: file, from: "{{tasks.compute-write.outputs.artifacts.file}}"}
      - name: compute-aggregate
        dependencies: [compute-transform]
        templateRef: {name: lisa-modules, template: aggregate}
        arguments:
          parameters:
          - {name: key, value: users/admin/test-07/file-3.txt}
          artifacts:
          - {name: dir, s3: {key: users/admin/test-07}}
