# TC03: writes a file, kept in the Global Storage.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: native-03-write-file-
  labels: {test: native-03}
spec:
  entrypoint: pipeline
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: compute-write
        templateRef: {name: lisa-modules, template: write}
        arguments:
          parameters:
          - {name: text, value: "This file was created by the compute-write module."}
          - {name: key, value: users/admin/test-03/new-file.txt}
