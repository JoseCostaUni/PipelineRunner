# TC02: reads an existing and a missing file from the Global Storage. Expected: the first step
# succeeds, the second fails (the input artifact does not exist), so the workflow fails.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: native-02-read-file-
  labels: {test: native-02}
spec:
  entrypoint: pipeline
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: compute-read-success
        templateRef: {name: lisa-modules, template: read}
        arguments:
          artifacts:
          - {name: file, s3: {key: tests/02/existing-file.txt}}
      - name: compute-read-fail
        templateRef: {name: lisa-modules, template: read}
        arguments:
          artifacts:
          - {name: file, s3: {key: tests/02/missing-file.txt}}
