<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="640" viewBox="0 0 1290 640" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3f47"/></marker><marker id="arrow-control-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3f47"/></marker><marker id="arrow-tunnel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5cc0"/></marker><marker id="arrow-tunnel-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5cc0"/></marker><marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0504d"/></marker><marker id="arrow-data-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0504d"/></marker><marker id="arrow-image" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b1f"/></marker><marker id="arrow-image-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b1f"/></marker><marker id="arrow-ssh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3f47"/></marker><marker id="arrow-ssh-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3f47"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<path d="M 330.0 26.0 L 370.0 26.0" fill="none" stroke="#3a3f47" stroke-width="1.4" marker-end="url(#arrow-control)"/>
<text x="378.0" y="30.0" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#2b2f36">interLink's calls</text>
<path d="M 560.0 26.0 L 600.0 26.0" fill="none" stroke="#8a5cc0" stroke-width="1.4" marker-end="url(#arrow-tunnel)"/>
<text x="608.0" y="30.0" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#2b2f36">the reverse tunnel</text>
<path d="M 790.0 26.0 L 830.0 26.0" fill="none" stroke="#c0504d" stroke-width="1.4" marker-end="url(#arrow-data)"/>
<text x="838.0" y="30.0" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#2b2f36">what goes through it</text>
<rect x="15" y="50" width="420" height="575" rx="14" fill="#f7fcf4" stroke="#86c472" stroke-width="1.3"/>
<text x="225.0" y="68.0" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2b2f36">Compute node: the Slurm job</text>
<rect x="450" y="50" width="360" height="575" rx="14" fill="#f7fcf4" stroke="#86c472" stroke-width="1.3"/>
<text x="630.0" y="68.0" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2b2f36">Login node</text>
<rect x="825" y="50" width="450" height="575" rx="14" fill="#f7fbfe" stroke="#6aa6d8" stroke-width="1.3"/>
<text x="1050.0" y="68.0" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2b2f36">Ulisses: Kubernetes</text>
<text x="30.0" y="92.0" font-size="13" font-weight="bold" font-style="normal" text-anchor="start" fill="#1f2329">1  The reverse tunnel: the job reaches Services in the cluster</text>
<rect x="35" y="110" width="170" height="54" rx="6" fill="#fdefc6" stroke="#e3c25e" stroke-width="1.2"/>
<text x="120.0" y="128.7" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#5c4610">Container</text>
<text x="120.0" y="145.4" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5c4610">connects to</text>
<text x="120.0" y="157.9" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#5c4610">global-storage…:9000</text>
<rect x="245" y="110" width="170" height="54" rx="6" fill="#f3f4f6" stroke="#b5bac1" stroke-width="1.2"/>
<text x="330.0" y="128.7" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2b2f36">/etc/hosts</text>
<text x="330.0" y="145.4" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#2b2f36">the Service's name</text>
<text x="330.0" y="157.9" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#2b2f36">→ 127.x.y.z</text>
<rect x="35" y="200" width="170" height="60" rx="6" fill="#e8ddf1" stroke="#a88ac8" stroke-width="1.2"/>
<text x="120.0" y="221.7" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3f2a5c">Relay (python3)</text>
<text x="120.0" y="238.4" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#3f2a5c">listens on 127.x.y.z:9000,</text>
<text x="120.0" y="250.9" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#3f2a5c">only the job's user</text>
<rect x="245" y="200" width="170" height="60" rx="6" fill="#e8ddf1" stroke="#a88ac8" stroke-width="1.2"/>
<text x="330.0" y="221.7" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3f2a5c">Unix socket</text>
<text x="330.0" y="238.4" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#3f2a5c">rev-9000.sock in</text>
<text x="330.0" y="250.9" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#3f2a5c">the pod's socket folder</text>
<rect x="245" y="300" width="170" height="60" rx="6" fill="#d3ecc6" stroke="#86c472" stroke-width="1.2"/>
<text x="330.0" y="321.7" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#24481a">sshd</text>
<text x="330.0" y="338.4" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#24481a">in user space, started</text>
<text x="330.0" y="350.9" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#24481a">inside the job</text>
<rect x="480" y="300" width="300" height="60" rx="6" fill="#d3ecc6" stroke="#86c472" stroke-width="1.2"/>
<text x="630.0" y="321.7" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#24481a">srun --overlap</text>
<text x="630.0" y="338.4" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#24481a">Slurm carries its stdin/stdout between</text>
<text x="630.0" y="350.9" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#24481a">slurmstepd and srun on the login node</text>
<rect x="480" y="200" width="300" height="60" rx="6" fill="#f3f4f6" stroke="#b5bac1" stroke-width="1.2"/>
<text x="630.0" y="221.7" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2b2f36">sshd :22 of the login node</text>
<text x="630.0" y="238.4" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#2b2f36">the shadow's SSH session (HPC_USER, its key);</text>
<text x="630.0" y="250.9" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#2b2f36">it never forwards anything itself</text>
<rect x="860" y="200" width="190" height="60" rx="6" fill="#e8ddf1" stroke="#a88ac8" stroke-width="1.2"/>
<text x="955.0" y="227.9" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3f2a5c">Shadow pod</text>
<text x="955.0" y="244.6" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#3f2a5c">ssh -R for each forward</text>
<rect x="1090" y="110" width="170" height="40" rx="6" fill="#f8d9d9" stroke="#e09898" stroke-width="1.2"/>
<text x="1175.0" y="134.2" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6b2222">Global Storage</text>
<rect x="1090" y="165" width="170" height="40" rx="6" fill="#cfe7f7" stroke="#6aa6d8" stroke-width="1.2"/>
<text x="1175.0" y="189.2" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#1d3d5c">Kubernetes API</text>
<rect x="1090" y="220" width="170" height="40" rx="6" fill="#ffe2c4" stroke="#ef9f55" stroke-width="1.2"/>
<text x="1175.0" y="244.2" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6b3a0c">Image mirror</text>
<rect x="1090" y="275" width="170" height="40" rx="6" fill="#f3f4f6" stroke="#b5bac1" stroke-width="1.2"/>
<text x="1175.0" y="299.2" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2b2f36">EXTRA_FORWARDS</text>
<path d="M 205.0 137.0 L 245.0 137.0" fill="none" stroke="#c0504d" stroke-width="1.4" marker-end="url(#arrow-data)"/>
<path d="M 120.0 164.0 L 120.0 200.0" fill="none" stroke="#c0504d" stroke-width="1.4" marker-end="url(#arrow-data)"/>
<text x="126.0" y="186.0" font-size="10" font-weight="normal" font-style="normal" text-anchor="start" fill="#c0504d">TCP</text>
<path d="M 205.0 230.0 L 245.0 230.0" fill="none" stroke="#8a5cc0" stroke-width="1.4" marker-end="url(#arrow-tunnel)"/>
<path d="M 330.0 260.0 L 330.0 300.0" fill="none" stroke="#8a5cc0" stroke-width="1.4" marker-end="url(#arrow-tunnel)"/>
<path d="M 415.0 330.0 L 480.0 330.0" fill="none" stroke="#8a5cc0" stroke-width="1.4" marker-end="url(#arrow-tunnel)" marker-start="url(#arrow-tunnel-s)"/>
<text x="447.5" y="324.0" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#8a5cc0">stdio</text>
<path d="M 630.0 300.0 L 630.0 260.0" fill="none" stroke="#8a5cc0" stroke-width="1.4" marker-end="url(#arrow-tunnel)" marker-start="url(#arrow-tunnel-s)"/>
<path d="M 860.0 230.0 L 780.0 230.0" fill="none" stroke="#8a5cc0" stroke-width="1.4" marker-end="url(#arrow-tunnel)"/>
<text x="820.0" y="224.0" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#8a5cc0">SSH</text>
<path d="M 1050.0 230.0 L 1070.0 230.0 L 1070.0 130.0 L 1090.0 130.0" fill="none" stroke="#8a5cc0" stroke-width="1.4" marker-end="url(#arrow-tunnel)"/>
<path d="M 1050.0 230.0 L 1070.0 230.0 L 1070.0 185.0 L 1090.0 185.0" fill="none" stroke="#8a5cc0" stroke-width="1.4" marker-end="url(#arrow-tunnel)"/>
<path d="M 1050.0 230.0 L 1070.0 230.0 L 1070.0 240.0 L 1090.0 240.0" fill="none" stroke="#8a5cc0" stroke-width="1.4" marker-end="url(#arrow-tunnel)"/>
<path d="M 1050.0 230.0 L 1070.0 230.0 L 1070.0 295.0 L 1090.0 295.0" fill="none" stroke="#8a5cc0" stroke-width="1.4" marker-end="url(#arrow-tunnel)"/>
<text x="955.0" y="290.0" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#8a5cc0">connects each socket</text>
<text x="955.0" y="302.5" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#8a5cc0">to its Service by name</text>
<text x="30.0" y="395.0" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#2b2f36">Who opens what: the shadow, from Ulisses, opens the SSH session and the srun; inside the job only</text>
<text x="30.0" y="408.8" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#2b2f36">local connections are made. The compute node never connects outwards, and the login node's sshd</text>
<text x="30.0" y="422.5" font-size="11" font-weight="normal" font-style="normal" text-anchor="start" fill="#2b2f36">is never asked to forward.</text>
<text x="30.0" y="475.0" font-size="13" font-weight="bold" font-style="normal" text-anchor="start" fill="#1f2329">2  interLink's calls: create, status, logs, delete</text>
<rect x="1090" y="500" width="170" height="54" rx="6" fill="#e8ddf1" stroke="#a88ac8" stroke-width="1.2"/>
<text x="1175.0" y="518.7" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3f2a5c">Virtual kubelet</text>
<text x="1175.0" y="535.4" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#3f2a5c">the pods on the</text>
<text x="1175.0" y="547.9" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#3f2a5c">virtual node</text>
<rect x="860" y="500" width="190" height="54" rx="6" fill="#e8ddf1" stroke="#a88ac8" stroke-width="1.2"/>
<text x="955.0" y="518.7" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3f2a5c">interLink API</text>
<text x="955.0" y="535.4" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#3f2a5c">your process, behind</text>
<text x="955.0" y="547.9" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#3f2a5c">a Unix socket</text>
<rect x="860" y="570" width="190" height="44" rx="6" fill="#e8ddf1" stroke="#a88ac8" stroke-width="1.2"/>
<text x="955.0" y="590.0" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3f2a5c">SSH tunnel</text>
<text x="955.0" y="606.7" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#3f2a5c">ssh -L 5100 → 4100</text>
<rect x="480" y="500" width="300" height="54" rx="6" fill="#e8ddf1" stroke="#a88ac8" stroke-width="1.2"/>
<text x="630.0" y="518.7" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#3f2a5c">interLink sidecar :4100</text>
<text x="630.0" y="535.4" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#3f2a5c">Slurm plugin 0.6.3, a user service</text>
<text x="630.0" y="547.9" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#3f2a5c">sbatch, squeue, scancel; job folders</text>
<rect x="35" y="500" width="380" height="54" rx="6" fill="#f8d9d9" stroke="#e09898" stroke-width="1.2"/>
<text x="225.0" y="518.7" font-size="12" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6b2222">The job's files on the shared file system</text>
<text x="225.0" y="535.4" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#6b2222">job.sh, env, mounted files in; status, exit codes</text>
<text x="225.0" y="547.9" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#6b2222">and logs out</text>
<path d="M 1090.0 527.0 L 1050.0 527.0" fill="none" stroke="#3a3f47" stroke-width="1.4" marker-end="url(#arrow-control)" marker-start="url(#arrow-control-s)"/>
<path d="M 955.0 554.0 L 955.0 570.0" fill="none" stroke="#3a3f47" stroke-width="1.4" marker-end="url(#arrow-control)" marker-start="url(#arrow-control-s)"/>
<path d="M 860.0 592.0 L 630.0 592.0 L 630.0 554.0" fill="none" stroke="#3a3f47" stroke-width="1.4" marker-end="url(#arrow-control)" marker-start="url(#arrow-control-s)"/>
<text x="745.0" y="586.0" font-size="10" font-weight="normal" font-style="normal" text-anchor="middle" fill="#3a3f47">SSH (port forward)</text>
<path d="M 480.0 527.0 L 415.0 527.0" fill="none" stroke="#3a3f47" stroke-width="1.4" marker-end="url(#arrow-control)" marker-start="url(#arrow-control-s)"/>
</svg>
