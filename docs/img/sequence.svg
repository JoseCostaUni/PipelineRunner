<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker>
    <style>
      .k{fill:#e8f0fb;stroke:#4a6fa5}
      .l{fill:#e8f5ec;stroke:#3c8d5a}
      .c{fill:#f4f1ea;stroke:#8a7a5a}
      .g{fill:#f0ebf8;stroke:#7a5ea8}
      .n{fill:#fffbe8;stroke:#b39a2e}
      .life{stroke:#999;stroke-dasharray:4 4}
      .hd{font-size:12.5px;font-weight:bold;fill:#222;text-anchor:middle}
      .hs{font-size:11px;fill:#444;text-anchor:middle}
      .m{font-size:11.5px;fill:#222;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
      .ms{font-size:11.5px;fill:#222;text-anchor:start}
      .num{font-size:11px;font-weight:bold;fill:#fff;text-anchor:middle}
      .msg{stroke:#333;stroke-width:1.5}
      .ret{stroke:#333;stroke-width:1.3;stroke-dasharray:5 3}
      .data{stroke:#2e7d4f;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="730" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">One Argo pod through the split executor</text>

  <!-- headers -->
  <rect class="k" x="20" y="48" width="150" height="50" rx="6"/><text class="hd" x="95" y="69">Argo + interLink</text><text class="hs" x="95" y="86">Ulisses</text>
  <rect class="l" x="190" y="48" width="140" height="50" rx="6"/><text class="hd" x="260" y="69">sidecar</text><text class="hs" x="260" y="86">login node</text>
  <rect class="l" x="350" y="48" width="160" height="50" rx="6"/><text class="hd" x="430" y="69">sbatch / squeue</text><text class="hs" x="430" y="86">wrappers, login node</text>
  <rect class="l" x="530" y="48" width="160" height="50" rx="6"/><text class="hd" x="610" y="69">login.sh (init, wait)</text><text class="hs" x="610" y="86">login node</text>
  <rect class="c" x="710" y="48" width="140" height="50" rx="6"/><text class="hd" x="780" y="69">Slurm</text><text class="hs" x="780" y="86">controller</text>
  <rect class="c" x="870" y="48" width="160" height="50" rx="6"/><text class="hd" x="950" y="69">main</text><text class="hs" x="950" y="86">compute node, offline</text>
  <rect class="g" x="1050" y="48" width="130" height="50" rx="6"/><text class="hd" x="1115" y="69">Global Storage</text><text class="hs" x="1115" y="86">MinIO</text>

  <line class="life" x1="95" y1="98" x2="95" y2="712"/>
  <line class="life" x1="260" y1="98" x2="260" y2="712"/>
  <line class="life" x1="430" y1="98" x2="430" y2="712"/>
  <line class="life" x1="610" y1="98" x2="610" y2="712"/>
  <line class="life" x1="780" y1="98" x2="780" y2="712"/>
  <line class="life" x1="950" y1="98" x2="950" y2="712"/>
  <line class="life" x1="1115" y1="98" x2="1115" y2="712"/>

  <!-- 1 -->
  <line class="msg" x1="95" y1="132" x2="258" y2="132" marker-end="url(#a)"/>
  <text class="m" x="177" y="126">1. create pod (ssh -L)</text>
  <!-- 2 -->
  <line class="msg" x1="260" y1="170" x2="428" y2="170" marker-end="url(#a)"/>
  <text class="m" x="345" y="164">2. sbatch job.slurm</text>
  <!-- 3 -->
  <rect class="n" x="440" y="184" width="330" height="34" rx="5"/>
  <text class="ms" x="450" y="199">3. job.sh keeps main only; init and wait lines</text>
  <text class="ms" x="450" y="213">move to login.sh; input binds and argoexec fixed</text>
  <!-- 4 -->
  <line class="msg" x1="430" y1="240" x2="778" y2="240" marker-end="url(#a)"/>
  <text class="m" x="690" y="234">4. sbatch --hold (job N)</text>
  <!-- 5 -->
  <line class="msg" x1="430" y1="274" x2="608" y2="274" marker-end="url(#a)"/>
  <text class="m" x="520" y="268">5. start login.sh N</text>
  <!-- 6 -->
  <line class="ret" x1="430" y1="304" x2="262" y2="304" marker-end="url(#a)"/>
  <text class="m" x="345" y="298">6. "Submitted batch job N"</text>
  <!-- 7 -->
  <line class="data" x1="1115" y1="344" x2="612" y2="344" marker-end="url(#ag)"/>
  <text class="m" x="862" y="338">7. init downloads the inputs into the emptyDirs on /projects</text>
  <!-- 8 -->
  <line class="msg" x1="610" y1="380" x2="778" y2="380" marker-end="url(#a)"/>
  <text class="m" x="694" y="374">8. scontrol release N</text>
  <!-- 9 -->
  <line class="msg" x1="780" y1="414" x2="948" y2="414" marker-end="url(#a)"/>
  <text class="m" x="864" y="408">9. run job.sh</text>
  <!-- 10 -->
  <rect class="n" x="960" y="428" width="225" height="48" rx="5"/>
  <text class="ms" x="970" y="444">10. argoexec emissary runs the</text>
  <text class="ms" x="970" y="458">user command; outputs and exit</text>
  <text class="ms" x="970" y="472">code go to the shared FS</text>
  <!-- 11 -->
  <line class="ret" x1="950" y1="500" x2="612" y2="500" marker-end="url(#a)"/>
  <text class="m" x="780" y="494">11. wait polls the exit code file (every 1 s, no inotify)</text>
  <!-- 12 -->
  <line class="data" x1="610" y1="538" x2="1113" y2="538" marker-end="url(#ag)"/>
  <text class="m" x="862" y="532">12. wait uploads the output artifacts</text>
  <!-- 13 -->
  <line class="msg" x1="610" y1="576" x2="97" y2="576" marker-end="url(#a)"/>
  <text class="m" x="352" y="570">13. wait reports the outputs (WorkflowTaskResult) through the relay</text>
  <!-- 14 -->
  <line class="msg" x1="260" y1="620" x2="428" y2="620" marker-end="url(#a)"/>
  <text class="m" x="345" y="614">14. squeue N (polled)</text>
  <line class="ret" x1="430" y1="656" x2="262" y2="656" marker-end="url(#a)"/>
  <text class="m" x="345" y="650">15. R until wait is done</text>
  <text class="m" x="345" y="674">then CD, or F with the highest exit code</text>
  <line class="ret" x1="260" y1="700" x2="97" y2="700" marker-end="url(#a)"/>
  <text class="m" x="177" y="694">16. pod Succeeded / Failed</text>
</svg>
