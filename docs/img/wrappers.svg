<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <style>
      .b{fill:#fff;stroke:#666}
      .w{fill:#e8f5ec;stroke:#3c8d5a}
      .sl{fill:#f4f1ea;stroke:#8a7a5a}
      .fs{fill:#fff7d6;stroke:#b39a2e}
      .h{font-size:14px;font-weight:bold;fill:#222}
      .t{font-size:12px;fill:#222}
      .tm{font-size:12px;fill:#222;text-anchor:middle}
      .tbm{font-size:13px;fill:#222;text-anchor:middle;font-weight:bold}
      .m{font-size:11.5px;fill:#222;font-family:Menlo, Consolas, monospace}
      .s{font-size:11px;fill:#444}
      .gray{font-size:11.5px;fill:#666;font-style:italic}
    </style>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">The three wrappers: Argo and interLink stay unmodified</text>

  <!-- sidecar -->
  <rect class="b" x="20" y="180" width="200" height="140" rx="8"/>
  <text class="tbm" x="120" y="206">interLink Slurm sidecar</text>
  <text class="tm" x="120" y="224">(unchanged, login node)</text>
  <text class="m" x="36" y="252">SbatchPath:</text>
  <text class="m" x="36" y="270">SqueuePath:</text>
  <text class="m" x="36" y="288">ScancelPath:</text>
  <text class="s" x="36" y="308">now point to the wrappers</text>

  <!-- sbatch -->
  <rect class="w" x="290" y="50" width="490" height="196" rx="8"/>
  <text class="h" x="306" y="74">sbatch</text>
  <text class="gray" x="366" y="74">called once per pod: sbatch job.slurm</text>
  <text class="t" x="306" y="98">Only for a pod with exactly one init, one wait and one main line in job.sh:</text>
  <text class="t" x="316" y="118">1. Takes the init and wait lines out of job.sh (the original is kept as job.sh.orig).</text>
  <text class="t" x="316" y="137">2. Fixes the input-artifact binds, because the plugin ignores subPath.</text>
  <text class="t" x="316" y="156">3. Makes main copy argoexec locally first (avoids "Text file busy").</text>
  <text class="t" x="316" y="175">4. Submits main on hold and prints the job ID for the sidecar.</text>
  <text class="t" x="316" y="194">5. Starts login.sh: init, then scontrol release, then wait and a watchdog.</text>
  <text class="t" x="306" y="220">Any other job goes to the real sbatch unchanged. If init fails, the</text>
  <text class="t" x="306" y="236">held job is cancelled and never uses the compute node.</text>

  <!-- squeue -->
  <rect class="w" x="290" y="266" width="490" height="132" rx="8"/>
  <text class="h" x="306" y="290">squeue</text>
  <text class="gray" x="370" y="290">polled by the sidecar: exit_code,StateCompact</text>
  <text class="t" x="306" y="314">For every job, prints 1 instead of Slurm's 1:0, so a failure is never read as 0.</text>
  <text class="t" x="306" y="333">For a split pod, reports PD while init stages the inputs and R until wait</text>
  <text class="t" x="306" y="350">has uploaded the outputs, even after the Slurm job has ended.</text>
  <text class="t" x="306" y="369">Then reports the highest exit code of init, main, wait and login.sh,</text>
  <text class="t" x="306" y="386">so the pod is Succeeded only if all of them exited 0.</text>

  <!-- scancel -->
  <rect class="w" x="290" y="418" width="490" height="78" rx="8"/>
  <text class="h" x="306" y="442">scancel</text>
  <text class="gray" x="372" y="442">when the pod is deleted or stopped</text>
  <text class="t" x="306" y="466">Stops login.sh (its systemd user unit) so init or wait do not keep</text>
  <text class="t" x="306" y="483">running, then calls the real scancel.</text>

  <!-- right column -->
  <rect class="b" x="850" y="50" width="330" height="110" rx="8"/>
  <text class="tbm" x="1015" y="76">login.sh</text>
  <text class="tm" x="1015" y="94">own systemd user unit on the login node</text>
  <text class="m" x="866" y="118">init</text><text class="s" x="910" y="118">downloads inputs (network)</text>
  <text class="m" x="866" y="136">wait</text><text class="s" x="910" y="136">uploads outputs, reports to Argo</text>
  <text class="s" x="866" y="152">watchdog: writes main's exit code if it never ran</text>

  <rect class="sl" x="850" y="200" width="330" height="90" rx="8"/>
  <text class="tbm" x="1015" y="226">real Slurm</text>
  <text class="m" x="866" y="250">sbatch --hold, scontrol release,</text>
  <text class="m" x="866" y="268">squeue, scancel</text>

  <rect class="fs" x="850" y="330" width="330" height="166" rx="8"/>
  <text class="tbm" x="1015" y="356">Job folder on /projects (shared FS)</text>
  <text class="m" x="866" y="380">job.sh</text><text class="s" x="1030" y="380">main only, run by Slurm</text>
  <text class="m" x="866" y="398">job.sh.orig</text><text class="s" x="1030" y="398">as interLink wrote it</text>
  <text class="m" x="866" y="416">login.sh, login.out</text><text class="s" x="1030" y="416">login side</text>
  <text class="m" x="866" y="434">split.log</text><text class="s" x="1030" y="434">what sbatch did</text>
  <text class="m" x="866" y="452">.split-released</text><text class="s" x="1030" y="452">init done</text>
  <text class="m" x="866" y="470">.split-login-done</text><text class="s" x="1030" y="470">wait done</text>
  <text class="m" x="866" y="488">emptyDirs/</text><text class="s" x="1030" y="488">inputs, outputs, exit code</text>

  <!-- arrows -->
  <line x1="220" y1="230" x2="288" y2="150" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="220" y1="260" x2="288" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="220" y1="290" x2="288" y2="450" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="780" y1="110" x2="848" y2="105" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="s" x="790" y="98">starts</text>
  <line x1="780" y1="200" x2="848" y2="230" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="s" x="784" y="232">--hold</text>
  <line x1="1015" y1="160" x2="1015" y2="198" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="s" x="1022" y="184">scontrol release</text>
  <line x1="780" y1="320" x2="848" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="780" y1="350" x2="848" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="s" x="790" y="340">markers</text>
  <line x1="780" y1="460" x2="848" y2="290" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
