# The image mirror ('k8s-side.sh mirror on', with IMAGE_MIRROR=on): a registry inside the cluster,
# zot, that pulls images on demand from Docker Hub, quay.io and ghcr.io and keeps them. Applied in
# ARGO_NAMESPACE. A job reaches it through the reverse tunnel, as image-mirror.<namespace>.svc:5000.
# An image named with its registry first is fetched from that registry (quay.io/argoproj/argoexec
# from quay.io); a bare name from Docker Hub, as Kubernetes reads it (alpine:3.20 is library/alpine,
# the last rule). Plain HTTP: it is reached only inside the cluster and through the tunnel. Its data
# is in an emptyDir, lost when the pod restarts (a cache: it fetches again).
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-mirror
  labels: {app: image-mirror, app.kubernetes.io/managed-by: deucalion-trial}
data:
  config.json: |
    {
      "distSpecVersion": "1.1.1",
      "storage": {"rootDirectory": "/var/lib/registry"},
      "http": {"address": "0.0.0.0", "port": "5000", "compat": ["docker2s2"]},
      "log": {"level": "info"},
      "extensions": {"sync": {"enable": true, "registries": [
        {"urls": ["https://registry-1.docker.io"], "onDemand": true, "tlsVerify": true,
         "content": [{"prefix": "**", "destination": "/docker.io"}]},
        {"urls": ["https://quay.io"], "onDemand": true, "tlsVerify": true,
         "content": [{"prefix": "**", "destination": "/quay.io"}]},
        {"urls": ["https://ghcr.io"], "onDemand": true, "tlsVerify": true,
         "content": [{"prefix": "**", "destination": "/ghcr.io"}]},
        {"urls": ["https://registry-1.docker.io"], "onDemand": true, "tlsVerify": true,
         "content": [{"prefix": "**"}]}
      ]}}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-mirror
  labels: {app: image-mirror, app.kubernetes.io/managed-by: deucalion-trial}
spec:
  replicas: 1
  selector: {matchLabels: {app: image-mirror}}
  template:
    metadata:
      labels: {app: image-mirror}
    spec:
      containers:
      - name: zot
        image: ghcr.io/project-zot/zot:v2.1.11
        args: [serve, /etc/zot/config.json]
        ports: [{containerPort: 5000}]
        readinessProbe: {httpGet: {path: /v2/, port: 5000}, periodSeconds: 5}
        volumeMounts:
        - {name: config, mountPath: /etc/zot}
        - {name: data, mountPath: /var/lib/registry}
      volumes:
      - {name: config, configMap: {name: image-mirror}}
      - {name: data, emptyDir: {sizeLimit: 30Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: image-mirror
  labels: {app: image-mirror, app.kubernetes.io/managed-by: deucalion-trial}
spec:
  selector: {app: image-mirror}
  ports: [{name: registry, port: 5000, targetPort: 5000}]
